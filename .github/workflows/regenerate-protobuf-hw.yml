name: regenerate protobuf hardware lock

on:
  push:
    branches:
      - security/protobuf-6.33-hw-regenerate
    paths:
      - .github/workflows/regenerate-protobuf-hw.yml
      - contrib/requirements/requirements-hw.txt

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'

      - name: Regenerate hardware deterministic requirements only
        shell: bash
        run: |
          set -euo pipefail
          SYSTEM_PYTHON="$(command -v python)"
          VENV="$RUNNER_TEMP/electrum-hw-freeze"

          "$SYSTEM_PYTHON" -m pip install 'hashin>=1.0.0'
          "$SYSTEM_PYTHON" -m venv "$VENV"
          source "$VENV/bin/activate"

          python -m pip install --upgrade 'pip==25.1.1' 'setuptools==80.9.0' 'wheel==0.45.1'

          while IFS= read -r package; do
            [ -z "$package" ] && continue
            python contrib/install_ghost.py "$package"
          done < contrib/requirements/ghost.txt

          python -m pip install -r contrib/requirements/requirements-hw.txt --upgrade

          requirements="$(pip freeze --all)"
          restricted="$(printf '%s\n' "$requirements" | python contrib/deterministic-build/find_restricted_dependencies.py)"
          if [ -n "$restricted" ]; then
            python -m pip install $restricted
          fi

          # Validate the resolver while ghost packages are still present. They are
          # intentionally removed before freezing so they do not enter the lock.
          python -m pip check

          while IFS= read -r package; do
            [ -z "$package" ] && continue
            name="${package%%==*}"
            python -m pip uninstall -y "$name"
          done < contrib/requirements/ghost.txt

          requirements="$(pip freeze --all)"
          : > contrib/deterministic-build/requirements-hw.txt
          "$SYSTEM_PYTHON" -m hashin -r contrib/deterministic-build/requirements-hw.txt $requirements

      - name: Verify protobuf runtime compatibility
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/electrum-hw-freeze/bin/activate"
          python - <<'PY'
          from google.protobuf import __version__ as protobuf_version
          from bitbox02.communication.generated import hww_pb2
          print('protobuf', protobuf_version)
          print('bitbox02 generated protobuf import: OK')
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/electrum/plugins/keepkey/keepkeylib" python - <<'PY'
          from keepkeylib import messages_pb2
          msg = messages_pb2.Initialize()
          msg.SerializeToString()
          print('keepkey generated protobuf serialize: OK')
          PY

      - name: Require supported protobuf lock
        shell: bash
        run: |
          set -euo pipefail
          grep -E '^protobuf==6\.33\.[5-9][0-9]* ' contrib/deterministic-build/requirements-hw.txt
          ! grep -q '^protobuf==3\.20\.3 ' contrib/deterministic-build/requirements-hw.txt

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contrib/deterministic-build/requirements-hw.txt
          if git diff --cached --quiet; then
            echo 'No lockfile changes.'
            exit 0
          fi
          git commit -m 'security: regenerate hardware lock with protobuf 6.33'
          git push origin HEAD:security/protobuf-6.33-hw-regenerate
